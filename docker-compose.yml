services:
  classifier-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: requests-classifier-api
    ports:
      - "8009:8000"
    environment:
      HYDRA_API_KEY: ${HYDRA_API_KEY:-}
      HYDRA_BASE_URL: ${HYDRA_BASE_URL:-https://api.hydraai.ru/v1}
      HYDRA_MODEL: ${HYDRA_MODEL:-gpt-5-mini}
      HYDRA_PREPROCESSOR_MODEL: ${HYDRA_PREPROCESSOR_MODEL:-gpt-5.4-mini}
      HYDRA_EMBEDDING_MODEL: ${HYDRA_EMBEDDING_MODEL:-text-embedding-3-small}
      CLASSIFIER_CORS_ORIGINS: ${CLASSIFIER_CORS_ORIGINS:-http://localhost:8009,http://127.0.0.1:8009}
    volumes:
      - ./data:/app/data
      - hf-cache:/root/.cache
    restart: unless-stopped

volumes:
  hf-cache:
